[project]
name = "llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway with cost/latency-aware routing, fallback, caching and per-tenant budgets"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.3", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
